[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmcbuilder-mcp-lite"
version = "0.1.0"
description = "Limited read-only MCP client for GMC Builder"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-GMC-Lite-Commercial"
license-files = ["LICENSE"]
authors = [{name = "GMC", email = "gmcfuerte@gmail.com"}]
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27.0,<1"]

[project.scripts]
gmcbuilder-mcp-lite = "gmcbuilder_mcp_lite.__main__:main"

[project.urls]
Repository = "https://github.com/gmcfuerte/gmcbuilder-mcp-lite"
Homepage = "https://fuerteventuratv.net/en/cms"

[tool.setuptools.packages.find]
where = ["."]
include = ["gmcbuilder_mcp_lite*"]
